name: build_actions

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 8.0, trunk ]
  pull_request:

jobs:
  build-workbench-windows:
    runs-on: windows-2022
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release_OSS]

    env:
      SOLUTION_FILE: MySQLWorkbench.sln
      PLATFORM: x64
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-bincache
      VCPKG_BINARY_SOURCES: "clear;files,C:\vcpkg-bincache,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.3

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-bincache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json', '.github/workflows/build_actions.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
          }

      - name: Create overlay port for vsqlitepp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portDir = "$env:GITHUB_WORKSPACE\overlay-ports\vsqlitepp"
          New-Item -ItemType Directory -Force -Path $portDir | Out-Null

          @'
          {
            "name": "vsqlitepp",
            "version-string": "0.3.13",
            "description": "VSQLite++ C++ wrapper for SQLite3",
            "homepage": "https://github.com/vinzenz/vsqlite--",
            "license": "BSD-3-Clause",
            "dependencies": [
              "sqlite3"
            ]
          }
          '@ | Set-Content -Path "$portDir\vcpkg.json" -Encoding UTF8

          @'
          vcpkg_from_github(
              OUT_SOURCE_PATH SOURCE_PATH
              REPO vinzenz/vsqlite--
              REF 2f3a1d6d4b0d6f9a4a36b2d8f7aa5e0c8ef0a123
              SHA512 0
              HEAD_REF master
          )

          file(INSTALL
              "${SOURCE_PATH}/include/"
              DESTINATION "${CURRENT_PACKAGES_DIR}/include"
              FILES_MATCHING
                  PATTERN "*.h"
                  PATTERN "*.hpp"
          )

          if(EXISTS "${SOURCE_PATH}/COPYING")
              file(INSTALL
                  "${SOURCE_PATH}/COPYING"
                  DESTINATION "${CURRENT_PACKAGES_DIR}/share/${PORT}"
                  RENAME copyright
              )
          elseif(EXISTS "${SOURCE_PATH}/LICENSE")
              file(INSTALL
                  "${SOURCE_PATH}/LICENSE"
                  DESTINATION "${CURRENT_PACKAGES_DIR}/share/${PORT}"
                  RENAME copyright
              )
          else()
              file(WRITE "${CURRENT_PACKAGES_DIR}/share/${PORT}/copyright" "See upstream repository.")
          endif()

          file(REMOVE_RECURSE "${CURRENT_PACKAGES_DIR}/debug")
          '@ | Set-Content -Path "$portDir\portfile.cmake" -Encoding UTF8

      - name: Install .NET Framework 4.5 reference assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 `
            -OutputDirectory tools `
            -ExcludeVersion

          $src = Join-Path $PWD "tools\Microsoft.NETFramework.ReferenceAssemblies.net45\build\.NETFramework\v4.5"
          $dst = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5"

          if (!(Test-Path $src)) { throw "Reference assemblies not found at $src" }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src\*" $dst -Recurse -Force

      - name: Install third-party dependencies with vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            cairo:x64-windows `
            glib:x64-windows `
            libxml2:x64-windows `
            rapidjson:x64-windows `
            python3:x64-windows `
            sqlite3:x64-windows `
            vsqlitepp:x64-windows `
            mysql-connector-cpp[core,jdbc]:x64-windows-static `
            boost-locale:x64-windows `
            boost-signals2:x64-windows `
            --overlay-ports="$env:GITHUB_WORKSPACE\overlay-ports"

      - name: Prepare WB_3DPARTY_PATH bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bundle = "D:\a\_temp\wb-3rdparty"
          $dyn = "D:\a\_temp\vcpkg\installed\x64-windows"
          $sta = "D:\a\_temp\vcpkg\installed\x64-windows-static"

          Remove-Item -Recurse -Force $bundle -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path `
            "$bundle\bin", "$bundle\lib", "$bundle\include", "$bundle\python", `
            "$bundle\debug\bin", "$bundle\debug\lib", "$bundle\debug\include" | Out-Null

          Copy-Item "$dyn\include\*" "$bundle\include" -Recurse -Force
          if (Test-Path "$sta\include") {
            Copy-Item "$sta\include\*" "$bundle\include" -Recurse -Force
          }

          if (Test-Path "$dyn\lib")       { Copy-Item "$dyn\lib\*"       "$bundle\lib"       -Force -ErrorAction SilentlyContinue }
          if (Test-Path "$dyn\bin")       { Copy-Item "$dyn\bin\*"       "$bundle\bin"       -Force -ErrorAction SilentlyContinue }
          if (Test-Path "$dyn\debug\lib") { Copy-Item "$dyn\debug\lib\*" "$bundle\debug\lib" -Force -ErrorAction SilentlyContinue }
          if (Test-Path "$dyn\debug\bin") { Copy-Item "$dyn\debug\bin\*" "$bundle\debug\bin" -Force -ErrorAction SilentlyContinue }

          if (Test-Path "$sta\lib")       { Copy-Item "$sta\lib\*"       "$bundle\lib"       -Force -ErrorAction SilentlyContinue }
          if (Test-Path "$sta\debug\lib") { Copy-Item "$sta\debug\lib\*" "$bundle\debug\lib" -Force -ErrorAction SilentlyContinue }

          $pyRoot = Get-ChildItem "$dyn\tools\python3" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pyRoot) {
            Copy-Item "$($pyRoot.FullName)\*" "$bundle\python" -Recurse -Force
          }

          "WB_3DPARTY_PATH=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WB_3DPARTY_LIB=$bundle"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch project files for vcpkg paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cdbc = "$env:GITHUB_WORKSPACE\library\cdbc\cdbc.vcxproj"
          $wbbe = "$env:GITHUB_WORKSPACE\backend\wbpublic\wbpublic.be.vcxproj"

          if (Test-Path $cdbc) {
            $xml = Get-Content $cdbc -Raw
            $xml = $xml -replace '</ClCompile>', @"
                <AdditionalIncludeDirectories>D:\a\_temp\vcpkg\installed\x64-windows-static\include;D:\a\_temp\vcpkg\installed\x64-windows-static\include\jdbc;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
                <PreprocessorDefinitions>CONCPP_BUILD_STATIC;%(PreprocessorDefinitions)</PreprocessorDefinitions>
              </ClCompile>
          "@
            $xml = $xml -replace '</Link>', @"
                <AdditionalLibraryDirectories>D:\a\_temp\vcpkg\installed\x64-windows-static\lib;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>
                <AdditionalDependencies>mysqlcppconn-static-mt.lib;libmysql.lib;%(AdditionalDependencies)</AdditionalDependencies>
              </Link>
          "@
            Set-Content $cdbc $xml -Encoding UTF8
          }

          if (Test-Path $wbbe) {
            $xml = Get-Content $wbbe -Raw
            $xml = $xml -replace '</ClCompile>', @"
                <AdditionalIncludeDirectories>D:\a\_temp\vcpkg\installed\x64-windows\include;D:\a\_temp\vcpkg\installed\x64-windows\include\jdbc;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
            "@
            Set-Content $wbbe $xml -Encoding UTF8
          }

      - name: Patch Boost source_location header
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hdr = "D:\a\_temp\wb-3rdparty\include\boost\assert\source_location.hpp"
          if (Test-Path $hdr) {
            (Get-Content $hdr -Raw) `
              -replace 'std::_snprintf_s', '_snprintf_s' `
              | Set-Content $hdr -Encoding UTF8
          }

      - name: Build Workbench
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild $env:SOLUTION_FILE `
            /m `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=$env:PLATFORM `
            /p:PlatformToolset=v143 `
            /p:PreferredToolArchitecture=x64 `
            /verbosity:minimal

      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "D:\a\mysql-workbench\mysql-workbench\bin\x64\${{ matrix.configuration }}\MySQLWorkbench.exe"
          if (!(Test-Path $exe)) {
            Write-Host "Workbench EXE not found. Dumping tree:"
            Get-ChildItem "D:\a\mysql-workbench\mysql-workbench\bin" -Recurse | Select-Object FullName
            throw "MySQLWorkbench.exe not found"
          }

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mysql-workbench-${{ matrix.configuration }}-x64
          path: |
            D:\a\mysql-workbench\mysql-workbench\bin\x64\${{ matrix.configuration }}\**
            D:\a\_temp\wb-3rdparty\bin\**
