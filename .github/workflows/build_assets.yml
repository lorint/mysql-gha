name: build_assets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-x64-release:
    runs-on: windows-2022

    env:
      BUILD_TYPE: Release
      BUILD_DIR: ${{ github.workspace }}\build
      INSTALL_DIR: ${{ github.workspace }}\install

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl --version=3.6.1 -y --no-progress --install-arguments '"/DIR=D:\a\mysql-gha\OpenSSL"'
          # --params "/InstallDir:D:\a\mysql-gha\OpenSSL"
          Write-Output "TACO1"
          Get-ChildItem -Path "D:\a\mysql-gha\OpenSSL"
          # -Directory | Select-Object -First 1 -ExpandProperty FullName
          # Write-Output "TACO2"
          # Get-ChildItem -Path "D:\a\mysql-gha\OpenSSL\lib"
          # -Directory | Select-Object -First 1 -ExpandProperty FullName
          Write-Output "TACO3"

      - name: Install build tools
        shell: pwsh
        run: |
          choco install winflexbison3 -y
          choco install ninja -y
          choco install strawberryperl -y

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          perl -v
          win_bison --version
          win_flex --version
          cl

      - name: Fetch and unpack Boost 1.77.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $boostBase = Join-Path $env:RUNNER_TEMP 'my_boost'
          $boostZip  = Join-Path $env:RUNNER_TEMP 'boost_1_77_0.zip'
          $boostUrl  = 'https://archives.boost.io/release/1.77.0/source/boost_1_77_0.zip'
          $boostRoot = Join-Path $boostBase 'boost_1_77_0'

          New-Item -ItemType Directory -Force -Path $boostBase | Out-Null

          Invoke-WebRequest -Uri $boostUrl -OutFile $boostZip

          if (!(Test-Path $boostZip)) {
            throw "Boost zip was not downloaded: $boostZip"
          }

          $size = (Get-Item $boostZip).Length
          Write-Host "Downloaded size: $size bytes"

          if ($size -lt 50MB) {
            throw "Downloaded file is unexpectedly small, likely not the real Boost archive."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($boostZip, $boostBase)

          Expand-Archive -Path $boostZip -DestinationPath $boostRoot -Force
          
          $boostDir = Get-ChildItem $boostRoot -Directory | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "BOOST_ROOT=$boostDir"

          "BOOST_ROOT=$boostDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          $env:OPENSSL_LIB_DIR = 'D:/a/mysql-gha/OpenSSL'
          cmake -S . -B "$env:BUILD_DIR" -G "Ninja" -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR" -DWITH_UNIT_TESTS=OFF -DWITH_ROUTER=OFF -DWITH_BOOST=D:\a\_temp\boost_1_77_0.zip -DDOWNLOAD_BOOST=0 `
            -DWITH_SSL="D:/a/mysql-gha/OpenSSL" `
            -DOPENSSL_LIBRARY="D:/a/mysql-gha/OpenSSL/lib/VC/x64/MD/libssl.lib" `
            -DCRYPTO_LIBRARY="D:/a/mysql-gha/OpenSSL/lib/VC/x64/MD/libcrypto.lib"

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:BUILD_DIR" --config Release --parallel
          # --prefix "$env:BUILD_DIR"
          cmake --install build --prefix "$env:BUILD_DIR"

      - name: Install
        shell: pwsh
        run: |
          $env:INSTALL_DIR = "D:\a\mysql-gha\mysql-gha\INSTALL"
          cmake --install "$env:INSTALL_DIR"

      - name: Verify key binaries
        shell: pwsh
        run: |
          $expected = @(
            "$env:INSTALL_DIR\bin\mysqld.exe",
            "$env:INSTALL_DIR\bin\mysql.exe"
          )

          foreach ($file in $expected) {
            if (!(Test-Path $file)) {
              throw "Missing expected file: $file"
            }
          }

      - name: Package artifact
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "mysql-server-windows-x64-release.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$env:INSTALL_DIR\*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mysql-server-windows-x64-release
          path: mysql-server-windows-x64-release.zip
          if-no-files-found: error
